name: Build

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Set up JDK 1.8
      uses: actions/setup-java@v1
      with:
        java-version: 1.8
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Install metafacture-core 5.7.1
      run: |
        cd ..
        git clone https://github.com/metafacture/metafacture-core.git
        cd metafacture-core
        git checkout metafacture-core-5.7.1
        ./gradlew publishToMavenLocal
        cd -
    - name: Build with Gradle
      run: ./gradlew build
      env:
        METAFIX_LOG_PASSED: true
    - name: Install language server
      run: ./gradlew installServer
    - name: Install fix extension
      working-directory: metafix-vsc/
      run: npm install
